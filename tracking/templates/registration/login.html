{% extends 'tracking/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card form-card"><h1>Sign in</h1><form method="post">{% csrf_token %}{% include 'tracking/fields.html' %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button full" type="submit">Sign in</button></form><p class="auth-switch">New here? <a href="{% url 'signup' %}">Create an account</a></p></section>
{% endblock %}
